<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04030a" />
    <title>Dev Room</title>
    <link rel="icon" href="./favicon.svg" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div id="start" class="start" role="button" tabindex="0">
      <div class="start__inner">
        <p class="start__sub" id="start-sub"></p>
        <h1 class="start__title" id="start-title"></h1>
        <p class="start__press" id="start-press"></p>
        <p class="start__coin" id="start-coin"></p>
      </div>
    </div>

    <aside id="panel" class="panel" hidden aria-live="polite"></aside>

    <div id="hud" class="hud">
      <button id="back" class="hud__back" type="button" hidden></button>
      <button id="lang" class="hud__lang" type="button" aria-label="Language"></button>
      <p id="hint" class="hud__hint"></p>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
